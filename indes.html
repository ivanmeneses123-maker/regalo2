<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d0d">
<meta name="color-scheme" content="dark">
<title>🌻 Flores amarillas para ti</title>

<!-- Vista previa al compartir por WhatsApp -->
<meta name="description" content="Una pequeña sorpresa hecha con cariño 💛 Toca para abrir tu regalo">
<meta property="og:type" content="website">
<meta property="og:title" content="🌻 Flores amarillas para ti">
<meta property="og:description" content="Una pequeña sorpresa hecha con cariño 💛 Toca para abrir tu regalo">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --night:#06181a;
  --night2:#0c2828;
  --paper:#fffaee;
  --ink:#3a2609;
  --brown:#7a4a08;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--night:#06181a;--night2:#0c2828}
}
:root[data-theme="dark"]{--night:#06181a;--night2:#0c2828}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:clip}

body{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 12px 70px;
  color:#fff8df;
  font-family:var(--sans);
  background-color:#081a1a;
  background:
    radial-gradient(circle at 50% 24%,rgba(34,91,76,.42),transparent 38%),
    radial-gradient(circle at 12% 85%,rgba(246,201,47,.08),transparent 30%),
    linear-gradient(145deg,var(--night),var(--night2) 48%,#041114);
  background-attachment:fixed;
  position:relative;
  -webkit-text-size-adjust:100%;
}

/* Fondo oscuro con resplandor amarillo que aparece al abrir el regalo */
.bgglow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0;transition:opacity 3s ease;
  background:
    radial-gradient(ellipse at 50% 36%,rgba(200,190,30,.30),transparent 52%),
    radial-gradient(ellipse at 50% 80%,rgba(150,160,20,.24),transparent 50%),
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.6));
}
body.opened .bgglow{opacity:1}

#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient-dot{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#ffe99a;
  box-shadow:0 0 14px 4px rgba(255,218,91,.35);
  animation:ambientFloat var(--dur) ease-in-out infinite;
  opacity:0;
}
@keyframes ambientFloat{
  0%,100%{transform:translate3d(0,15px,0) scale(.55);opacity:0}
  25%,75%{opacity:.65}
  50%{transform:translate3d(var(--dx),var(--dy),0) scale(1.15);opacity:.9}
}

/* main NO lleva z-index: así la tarjeta (z 40) siempre queda por encima de todo */
main{
  width:min(100%,600px);
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

h1{
  margin:0 0 4px;
  font-family:var(--serif);
  font-size:clamp(1.9rem,7.5vw,2.9rem);
  font-weight:400;
  line-height:1.1;
  background:linear-gradient(100deg,#fff8df 8%,#f4c52e 42%,#fff5b9 58%,#fff8df 92%);
  background-size:240% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  animation:titleShine 5s linear infinite;
}
@keyframes titleShine{to{background-position:240% center}}

.sub{
  margin:0 0 4px;
  color:rgba(255,247,213,.72);
  font-size:.72rem;
  letter-spacing:.24em;
  text-transform:uppercase;
}

/* ============ ESCENARIO: corazón + ramo + galaxia ============ */
.stage{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;            /* el ancho real lo fija el JS = ancho de pantalla */
}
#sky{
  position:absolute;left:0;top:0;
  width:100%;height:100%;
  display:block;
  pointer-events:none;
  z-index:0;
}

.ramo-wrap{
  width:min(88vw,480px,calc(50vh * .8889));
  width:min(88vw,480px,calc(50dvh * .8889));
  aspect-ratio:800 / 900;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.35));
}
.ramo{
  width:100%;height:100%;display:block;overflow:visible;
  transform-origin:50% 92%;
  animation:sway 6s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:rotate(-.4deg)}
  50%{transform:rotate(.5deg)}
}

.glow-ring{
  position:absolute;left:50%;top:34%;
  width:70%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,216,90,.22),transparent 66%);
  filter:blur(10px);
  pointer-events:none;
  animation:ringPulse 4s ease-in-out infinite;
}
@keyframes ringPulse{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.65}}

/* Flores: capullo cerrado -> abiertas. El origen es el centro de cada flor */
.bloom{
  transform-box:view-box;
  transform-origin:0 0;
  transform:rotate(-40deg) scale(.2);
  transition:transform 1.6s cubic-bezier(.16,1.35,.32,1);
  transition-delay:var(--delay,0s);
}
main.opened .bloom{
  transform:rotate(0) scale(1);
  animation:bloomPulse 4.4s ease-in-out infinite;
  animation-delay:calc(var(--delay,0s) + 1.7s);
}
@keyframes bloomPulse{50%{transform:rotate(0) scale(1.04)}}

.spark{opacity:0;transform-box:fill-box;transform-origin:center}
main.opened .spark{animation:sparkPop 1.6s ease-out var(--delay) both}
@keyframes sparkPop{
  0%{opacity:0;transform:scale(.1)}
  30%{opacity:1;transform:scale(1.3)}
  100%{opacity:0;transform:scale(2)}
}

/* ============ BOTONES ============ */
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:30}
button{
  border:0;border-radius:999px;cursor:pointer;
  font:800 1rem var(--sans);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.primary{
  margin-top:10px;
  padding:15px 32px;
  color:#3b2a0d;
  background:linear-gradient(135deg,#fff0a0,#f6c52f 55%,#e6a814);
  box-shadow:0 5px 0 #a66f0a,0 14px 30px rgba(0,0,0,.3),0 0 0 1px rgba(255,246,185,.35) inset;
  position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
.primary::after{
  content:"";position:absolute;inset:-30% auto -30% -70%;width:45%;
  transform:skewX(-24deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
  animation:buttonShine 3.2s infinite;
}
@keyframes buttonShine{0%{left:-70%}60%,100%{left:135%}}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a66f0a,0 8px 16px rgba(0,0,0,.28)}

.secondary{
  margin-top:16px;
  padding:11px 22px;
  color:#fff7d8;
  background:rgba(255,245,195,.1);
  border:1px solid rgba(255,235,156,.4);
  position:relative;z-index:40;
}
.secondary:hover{background:rgba(255,245,195,.18)}
[hidden]{display:none!important}

/* ============ TARJETA ============ */
.card{
  width:100%;
  margin-top:14px;
  padding:26px 24px 22px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(236,194,75,.6);
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 45px rgba(247,201,47,.15),inset 0 1px 0 rgba(255,255,255,.9);
  opacity:0;
  display:none;
  z-index:40;
}
main.opened .card{
  display:block;
  animation:cardIn 1.1s cubic-bezier(.2,1.1,.3,1) 4.6s both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px) scale(.96)}
  to{opacity:1;transform:none}
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 20%,rgba(246,197,47,.18),transparent 22%),
    radial-gradient(circle at 88% 80%,rgba(246,197,47,.12),transparent 24%);
}
.corner{position:absolute;width:55px;height:55px;border:1px solid rgba(177,128,22,.35)}
.corner.a{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.corner.b{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 18px 0}

.para{
  position:relative;margin:0 0 12px;
  font:italic 400 1.75rem var(--serif);
  color:var(--brown);
  text-align:center;
}
/* El texto fantasma reserva la altura final para que la tarjeta no "salte" al escribir */
.mensaje{
  position:relative;margin:0 auto 14px;max-width:480px;
  font-size:1.05rem;line-height:1.75;font-weight:600;
  color:var(--ink);text-align:center;
}
.mensaje .ghost{visibility:hidden}
.mensaje .typed{position:absolute;inset:0}
.firma{
  position:relative;margin:8px 0 0;
  font:italic 400 1.3rem var(--serif);
  color:var(--brown);text-align:right;
  opacity:0;transition:opacity .9s ease;
}
.firma.show{opacity:1}

.touch{
  position:fixed;pointer-events:none;z-index:60;
  font-size:30px;
  transform:translate(-50%,-50%);
  animation:touchPop 1.15s ease-out forwards;
  text-shadow:0 0 18px rgba(255,212,69,.8);
}
@keyframes touchPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-145%) scale(.78)}
}

@media (max-width:600px){
  .card{padding:24px 18px 20px;border-radius:20px}
  .para{font-size:1.55rem}
  .mensaje{font-size:1rem;line-height:1.7}
  .firma{font-size:1.2rem}
  .sub{font-size:.64rem;letter-spacing:.16em}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #ambient{display:none}
}
</style>
</head>

<body>
<div class="bgglow" aria-hidden="true"></div>
<div id="ambient" aria-hidden="true"></div>

<main id="scene">
  <h1 id="title">Flores amarillas para ti</h1>
  <p class="sub">una pequeña sorpresa hecha con cariño</p>

  <div class="stage" id="stage">
    <canvas id="sky" aria-hidden="true"></canvas>

    <div class="ramo-wrap" id="ramoWrap">
      <div class="glow-ring"></div>
    <svg class="ramo" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Ramo de rosas amarillas y girasoles">
      <defs>
        <linearGradient id="sunPetal" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#f0a812"/>
          <stop offset=".55" stop-color="#ffd23a"/>
          <stop offset="1" stop-color="#fff08a"/>
        </linearGradient>
        <radialGradient id="sunCenter" cx="40%" cy="35%" r="75%">
          <stop offset="0" stop-color="#9c6a21"/>
          <stop offset=".45" stop-color="#57330e"/>
          <stop offset="1" stop-color="#241304"/>
        </radialGradient>
        <radialGradient id="roseOuter" cx="35%" cy="25%" r="95%">
          <stop offset="0" stop-color="#ffe680"/>
          <stop offset=".55" stop-color="#eeb21c"/>
          <stop offset="1" stop-color="#b87a0a"/>
        </radialGradient>
        <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7db566"/>
          <stop offset=".5" stop-color="#3c7f4f"/>
          <stop offset="1" stop-color="#1a4630"/>
        </linearGradient>
        <linearGradient id="paperG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf0"/>
          <stop offset=".55" stop-color="#f5e6b8"/>
          <stop offset="1" stop-color="#d9bf7c"/>
        </linearGradient>
        <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f0c94a"/>
          <stop offset=".5" stop-color="#b5850f"/>
          <stop offset="1" stop-color="#6a480a"/>
        </linearGradient>

        <!-- pétalo de rosa (base en 0,0 apuntando hacia arriba) -->
        <path id="rp" d="M0 4 C-30 -4 -40 -40 0 -54 C40 -40 30 -4 0 4Z"/>

        <!-- ROSA (radio ~54) -->
        <g id="rose">
          <g fill="url(#roseOuter)" stroke="#a86e08" stroke-width="1" stroke-opacity=".55">
            <use href="#rp" transform="rotate(0)"/>
            <use href="#rp" transform="rotate(72)"/>
            <use href="#rp" transform="rotate(144)"/>
            <use href="#rp" transform="rotate(216)"/>
            <use href="#rp" transform="rotate(288)"/>
          </g>
          <g fill="#f4bb22" stroke="#b17a0a" stroke-width="1.1" stroke-opacity=".5">
            <use href="#rp" transform="rotate(36) scale(.8)"/>
            <use href="#rp" transform="rotate(108) scale(.8)"/>
            <use href="#rp" transform="rotate(180) scale(.8)"/>
            <use href="#rp" transform="rotate(252) scale(.8)"/>
            <use href="#rp" transform="rotate(324) scale(.8)"/>
          </g>
          <g fill="#ffd43e" stroke="#c48b0e" stroke-width="1.3" stroke-opacity=".5">
            <use href="#rp" transform="rotate(15) scale(.56)"/>
            <use href="#rp" transform="rotate(87) scale(.56)"/>
            <use href="#rp" transform="rotate(159) scale(.56)"/>
            <use href="#rp" transform="rotate(231) scale(.56)"/>
            <use href="#rp" transform="rotate(303) scale(.56)"/>
          </g>
          <g fill="#ffe680" stroke="#c48b0e" stroke-width="1.6" stroke-opacity=".5">
            <use href="#rp" transform="rotate(40) scale(.34)"/>
            <use href="#rp" transform="rotate(130) scale(.34)"/>
            <use href="#rp" transform="rotate(220) scale(.34)"/>
            <use href="#rp" transform="rotate(310) scale(.34)"/>
          </g>
          <circle r="4.5" fill="#d99a0b"/>
          <path d="M-30 -30 Q-8 -46 16 -36" fill="none" stroke="#fff5b8" stroke-width="4" stroke-linecap="round" opacity=".45"/>
        </g>

        <!-- GIRASOL (radio 102) — se rellena con JS -->
        <g id="sunflower"></g>

        <!-- HOJA (apunta a +x) -->
        <g id="leaf">
          <path d="M0 0 C18 -26 62 -32 96 -6 C64 24 20 24 0 0Z" fill="url(#leafG)" stroke="#173f2a" stroke-width="1.2"/>
          <path d="M4 -1 Q50 -9 90 -6" fill="none" stroke="#b9dc9c" stroke-width="1.6" opacity=".55"/>
        </g>
      </defs>

      <!-- sombra -->
      <ellipse cx="400" cy="872" rx="150" ry="16" fill="rgba(0,0,0,.3)"/>

      <!-- interior del cono (parte de atrás) -->
      <path d="M215 618 Q400 590 585 618 Q400 668 215 618Z" fill="#a98f52"/>

      <!-- TALLOS: todos nacen en (400,690) y terminan justo en el centro de cada flor -->
      <g fill="none" stroke="#4a8f55" stroke-width="8" stroke-linecap="round">
        <path d="M400 690 C398 500 402 340 400 190"/>
        <path d="M400 690 C380 540 290 430 235 300"/>
        <path d="M400 690 C420 540 510 430 565 310"/>
        <path d="M400 690 C360 600 220 540 140 430"/>
        <path d="M400 690 C440 600 580 540 660 430"/>
        <path d="M400 690 C380 620 330 550 300 470"/>
        <path d="M400 690 C420 620 470 550 500 480"/>
        <path d="M400 690 C405 600 395 500 400 400"/>
      </g>

      <!-- hojas -->
      <g>
        <use href="#leaf" transform="translate(386 640) rotate(205) scale(1.05)"/>
        <use href="#leaf" transform="translate(414 640) rotate(335) scale(1.05)"/>
        <use href="#leaf" transform="translate(372 606) rotate(168) scale(.85)"/>
        <use href="#leaf" transform="translate(428 606) rotate(12) scale(.85)"/>
        <use href="#leaf" transform="translate(285 567) rotate(152) scale(.9)"/>
        <use href="#leaf" transform="translate(515 567) rotate(28) scale(.9)"/>
        <use href="#leaf" transform="translate(331 488) rotate(192) scale(.8)"/>
        <use href="#leaf" transform="translate(469 488) rotate(348) scale(.8)"/>
        <use href="#leaf" transform="translate(398 545) rotate(215) scale(1)"/>
        <use href="#leaf" transform="translate(402 525) rotate(325) scale(.95)"/>
      </g>

      <!-- destellos -->
      <g fill="#fff0a8">
        <circle class="spark" style="--delay:1.0s" cx="150" cy="300" r="5"/>
        <circle class="spark" style="--delay:1.2s" cx="655" cy="255" r="5"/>
        <circle class="spark" style="--delay:1.4s" cx="400" cy="35" r="6"/>
        <circle class="spark" style="--delay:1.6s" cx="70" cy="400" r="4"/>
        <circle class="spark" style="--delay:1.8s" cx="735" cy="395" r="4"/>
        <circle class="spark" style="--delay:1.5s" cx="235" cy="115" r="4"/>
        <circle class="spark" style="--delay:1.7s" cx="570" cy="110" r="4"/>
      </g>

      <!-- FLORES (de atrás hacia adelante) -->
      <g transform="translate(400 190) scale(1.35)"><g class="bloom" style="--delay:.05s"><use href="#sunflower"/></g></g>

      <g transform="translate(235 300) scale(.95)"><g class="bloom" style="--delay:.3s"><use href="#sunflower"/></g></g>
      <g transform="translate(565 310) scale(.95)"><g class="bloom" style="--delay:.45s"><use href="#sunflower"/></g></g>

      <g transform="translate(140 430) scale(1)"><g class="bloom" style="--delay:.6s"><use href="#rose"/></g></g>
      <g transform="translate(660 430) scale(1)"><g class="bloom" style="--delay:.75s"><use href="#rose"/></g></g>

      <g transform="translate(400 400) scale(1)"><g class="bloom" style="--delay:.9s"><use href="#rose"/></g></g>
      <g transform="translate(300 470) scale(1.1)"><g class="bloom" style="--delay:1.0s"><use href="#rose"/></g></g>
      <g transform="translate(500 480) scale(.62)"><g class="bloom" style="--delay:1.1s"><use href="#sunflower"/></g></g>

      <!-- papel del ramo (parte de adelante) -->
      <g>
        <path d="M215 618 Q400 668 585 618 L442 862 Q400 874 358 862Z" fill="url(#paperG)"/>
        <path d="M215 618 Q310 648 392 780 L358 862Z" fill="#cdb27a" opacity=".5"/>
        <path d="M585 618 Q490 648 408 780 L442 862Z" fill="#fff" opacity=".3"/>
        <path d="M215 618 Q400 668 585 618" fill="none" stroke="#c6a762" stroke-width="3" opacity=".85"/>
      </g>

      <!-- lazo -->
      <g>
        <path d="M400 742 Q370 790 346 828 Q380 820 402 762Z" fill="url(#ribbonG)"/>
        <path d="M400 742 Q430 790 454 828 Q420 820 398 762Z" fill="url(#ribbonG)"/>
        <path d="M400 736 C335 692 315 762 400 748Z" fill="url(#ribbonG)"/>
        <path d="M400 736 C465 692 485 762 400 748Z" fill="url(#ribbonG)"/>
        <circle cx="400" cy="741" r="13" fill="#b98918"/>
        <circle cx="396" cy="737" r="4" fill="#fff1a0" opacity=".6"/>
      </g>
    </svg>
    </div>

    <div class="controls">
      <button class="primary" id="openBtn" type="button">Abrir regalo 💛</button>
    </div>
  </div>

  <section class="card" id="card" aria-live="polite">
    <span class="corner a"></span><span class="corner b"></span>
    <p class="para" id="to"></p>
    <p class="mensaje"><span class="ghost" id="ghost"></span><span class="typed" id="message"></span></p>
    <p class="firma" id="signature"></p>
  </section>

  <button class="secondary" id="closeBtn" type="button" hidden>Volver a cerrar el ramo</button>
</main>

<script>
/* ============== TEXTOS (edítalos aquí) ============== */
const CONFIG = {
  titulo: "Flores amarillas para ti",
  para: "Para Delia 💛",
  mensaje: "Cada flor amarilla lleva un deseo: que tus días sean luminosos, que nunca te falte alegría y que recuerdes lo mucho que vales. Que esta pequeña sorpresa te saque una sonrisa y te recuerde que hay alguien que piensa en ti con mucho cariño. 🌻🌹✨",
  firma: "Con cariño, Ivan 🌻",
  corazon: "Te amo 💛",            /* texto dentro del corazón de partículas */
  frases: [                        /* frases que flotan alrededor de la galaxia */
    "Te amo 💛","Eres mi sol 🌻","Siempre juntos 💛","Me encantas ✨",
    "Mi amor 💛","Eres única 🌹","Te quiero 🌻","Mi niña bonita 💛",
    "Eres mi persona favorita ✨","Te adoro 🌹"
  ]
};

const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const mk = (tag, attrs) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

const scene = $("scene"), openBtn = $("openBtn"), closeBtn = $("closeBtn");
const message = $("message"), card = $("card"), firma = $("signature");

document.title = "🌻 " + CONFIG.titulo;
$("title").textContent = CONFIG.titulo;
$("to").textContent = CONFIG.para;
firma.textContent = CONFIG.firma;
$("ghost").textContent = CONFIG.mensaje;

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============== GIRASOL DEL RAMO (pétalos puntiagudos + semillas en espiral) ============== */
(function buildSunflower(){
  const g = $("sunflower");
  const petal = "M0 -24 C17 -44 16 -84 0 -102 C-16 -84 -17 -44 0 -24Z";
  const N = 20;
  for (let i = 0; i < N; i++) {
    g.appendChild(mk("path", { d: petal, fill: "#e19a0e", transform: `rotate(${(i + .5) * 360 / N}) scale(.9)` }));
  }
  for (let i = 0; i < N; i++) {
    g.appendChild(mk("path", {
      d: petal, fill: "url(#sunPetal)",
      stroke: "#c98a0a", "stroke-width": .9, "stroke-opacity": .45,
      transform: `rotate(${i * 360 / N})`
    }));
  }
  g.appendChild(mk("circle", { r: 41, fill: "#c47d0a", opacity: .9 }));
  g.appendChild(mk("circle", { r: 37, fill: "url(#sunCenter)" }));
  for (let k = 1; k <= 90; k++) {
    const a = k * 137.508 * Math.PI / 180, r = 3.6 * Math.sqrt(k);
    g.appendChild(mk("circle", {
      cx: (Math.cos(a) * r).toFixed(2), cy: (Math.sin(a) * r).toFixed(2),
      r: (1.2 + r / 34).toFixed(2), fill: k % 3 ? "#1f1105" : "#a06a22", opacity: .72
    }));
  }
  g.appendChild(mk("ellipse", { cx: -12, cy: -15, rx: 15, ry: 7, fill: "#fff3b8", opacity: .2, transform: "rotate(-30 -12 -15)" }));
})();

/* ============== PARTICULAS AMBIENTALES ============== */
(function ambientParticles(){
  const layer = $("ambient");
  const count = innerWidth < 600 ? 14 : 24;
  for (let i = 0; i < count; i++) {
    const d = document.createElement("span");
    d.className = "ambient-dot";
    d.style.left = Math.random() * 100 + "%";
    d.style.top = Math.random() * 95 + "%";
    d.style.setProperty("--dx", (Math.random() * 70 - 35) + "px");
    d.style.setProperty("--dy", (Math.random() * 80 - 40) + "px");
    d.style.setProperty("--dur", (3 + Math.random() * 5) + "s");
    d.style.animationDelay = (-Math.random() * 6) + "s";
    layer.appendChild(d);
  }
})();

/* =====================================================================
   ESCENA: galaxia de polvo dorado + corazón de partículas + objetos en órbita
   (se dibuja en un <canvas> detrás del ramo)
   ===================================================================== */
const Scene = (function(){
  const stage = $("stage"), cv = $("sky"), rw = $("ramoWrap"), ctx = cv.getContext("2d");
  const SP = reduceMotion ? .3 : 1;
  const SMALL = document.documentElement.clientWidth < 600;
  const COLS  = ["#fffbe0", "#fff0a0", "#ffd84a", "#f2b91b", "#d99a10"];
  const HCOLS = ["#fff6c8", "#ffe270", "#ffd23a"];
  const TAU = Math.PI * 2;
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const FONT = '"DM Serif Display",Georgia,"Times New Roman",serif';

  let SW = 0, SH = 0, dpr = 1, U = 1, tt = 0, last = 0, op = 0, opened = false, openT = 0;
  const geo = { gx: 0, gy: 0, Rx: 120, Ry: 36, hcx: 0, hcy: 0, hw: 160 };

  /* ---------- dibujos pequeños (ramo, girasol, rosa) ---------- */
  const SUNP = "M0 -24 C17 -44 16 -84 0 -102 C-16 -84 -17 -44 0 -24Z";
  const RP = "M0 3 C-18 -3 -24 -24 0 -32 C24 -24 18 -3 0 3Z";
  function sunG(cx, cy, R){
    let back = "", front = "";
    for (let i = 0; i < 14; i++) {
      back  += `<path d="${SUNP}" transform="rotate(${(i + .5) * 360 / 14}) scale(.9)"/>`;
      front += `<path d="${SUNP}" transform="rotate(${i * 360 / 14})"/>`;
    }
    return `<g transform="translate(${cx} ${cy}) scale(${R / 102})"><g fill="#f0a812">${back}</g>` +
      `<g fill="#ffd93f" stroke="#c98a0a" stroke-width="2.5" stroke-opacity=".6">${front}</g>` +
      `<circle r="41" fill="#c47d0a"/><circle r="36" fill="#5a340f"/><circle r="24" fill="#3b2109"/><circle r="10" fill="#22130a"/></g>`;
  }
  function roseG(cx, cy, R){
    const ring = (n, rot, sc, fill) => {
      let o = `<g fill="${fill}" stroke="#a86e08" stroke-width="1.4" stroke-opacity=".6">`;
      for (let i = 0; i < n; i++) o += `<path d="${RP}" transform="rotate(${rot + i * 360 / n}) scale(${sc})"/>`;
      return o + "</g>";
    };
    return `<g transform="translate(${cx} ${cy}) scale(${R / 32})">${ring(5,0,1,"#eeb01c")}${ring(5,36,.78,"#f7c630")}${ring(5,15,.55,"#ffd950")}${ring(4,40,.33,"#ffe680")}</g>`;
  }
  const wrapSvg = (vb, w, h, body) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${body}</svg>`;

  const SPR = {
    sun:  { ar: 1,    w: 46, svg: wrapSvg("0 0 100 100", 200, 200, sunG(50, 50, 47)) },
    rose: { ar: 1,    w: 38, svg: wrapSvg("0 0 80 80", 160, 160, roseG(40, 40, 37)) },
    bouquet: { ar: 1.25, w: 66, svg: wrapSvg("0 0 120 150", 240, 300,
      `<g stroke="#3f8a4f" stroke-width="3.2" fill="none" stroke-linecap="round"><path d="M60 112C60 80 60 60 60 42"/><path d="M60 112C50 95 40 78 30 62"/><path d="M60 112C70 95 82 78 92 62"/></g>` +
      `<path d="M56 96Q32 84 24 98Q42 110 56 96Z" fill="#3c7f4f"/><path d="M64 96Q88 84 96 98Q78 110 64 96Z" fill="#3c7f4f"/>` +
      sunG(60, 40, 30) + sunG(28, 63, 21) + sunG(94, 63, 21) + roseG(60, 72, 12) +
      `<path d="M20 88Q60 106 100 88L70 146Q60 151 50 146Z" fill="#f8e9b8" stroke="#d3b76f" stroke-width="1.5"/>` +
      `<path d="M60 118C46 108 44 124 60 122Z M60 118C74 108 76 124 60 122Z" fill="#d8a41e"/><circle cx="60" cy="120" r="3.4" fill="#b98918"/>`) }
  };
  for (const k in SPR) {
    const im = new Image();
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SPR[k].svg);
    SPR[k].im = im;
  }

  /* halo suave que se dibuja detrás de cada objeto */
  const halo = document.createElement("canvas");
  halo.width = halo.height = 64;
  (function(){
    const c = halo.getContext("2d"), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,225,110,.7)");
    g.addColorStop(1, "rgba(255,200,60,0)");
    c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  })();

  /* ---------- estrellas de fondo ---------- */
  const stars = [];
  for (let i = 0; i < (SMALL ? 45 : 80); i++) {
    stars.push({ x: Math.random(), y: Math.random(), s: .8 + Math.random() * 1.1, tw: .6 + Math.random() * 2, ph: Math.random() * TAU });
  }

  /* ---------- polvo de la galaxia (brazos en espiral) ---------- */
  const dust = [[], [], [], [], []];
  const DUST_N = SMALL ? 800 : 1200;
  for (let i = 0; i < DUST_N; i++) {
    const arm = i % 3, r = Math.pow(Math.random(), .62);
    let th = arm * 2.0944 + r * 3.3 + gauss() * .22;
    if (Math.random() < .22) th = Math.random() * TAU;
    dust[Math.min(4, Math.floor(r * 5))].push({
      r, th, dz: gauss() * 4 * (1 - r * .6),
      s: r < .3 ? 2 : 1.3 + Math.random() * 1.3,
      a: .5 + Math.random() * .5,
      tw: .8 + Math.random() * 2.2, ph: Math.random() * TAU
    });
  }

  /* ---------- partículas del corazón ----------
     Cerrado: se mezclan con el polvo de la galaxia.
     Abierto: suben en corrientes y forman el corazón. */
  const hb = [[], [], []];
  const HEART_N = SMALL ? 460 : 640;
  for (let i = 0; i < HEART_N; i++) {
    const t = Math.random() * TAU, kind = Math.random();
    const bx = 16 * Math.pow(Math.sin(t), 3);
    const by = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    let hx, hy;
    if (kind < .8)       { hx = bx + gauss() * .5;  hy = by + gauss() * .5; }
    else if (kind < .92) { hx = bx + gauss() * 1.6; hy = by + gauss() * 1.6; }
    else { const k = Math.sqrt(Math.random()) * .85; hx = bx * k + gauss() * .5; hy = by * k + gauss() * .5; }
    hb[i % 3].push({
      hx, hy, x: null, y: null,
      gr: Math.pow(Math.random(), .65), gth: Math.random() * TAU,
      dl: Math.random() * 2.2, k: 1.1 + Math.random() * 1.7,
      s: 1.3 + Math.random() * 1.6, a: .6 + Math.random() * .4,
      tw: 1 + Math.random() * 3, ph: Math.random() * TAU
    });
  }

  /* ---------- objetos que giran alrededor: frases, ramos, girasoles, rosas ---------- */
  const items = [];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  shuffle(CONFIG.frases.slice()).slice(0, SMALL ? 6 : 8).forEach(t => items.push({ type: "text", text: t, big: Math.random() < .3 }));
  (SMALL ? ["bouquet","bouquet","bouquet","sun","sun","rose"]
         : ["bouquet","bouquet","bouquet","bouquet","sun","sun","sun","rose","rose"])
    .forEach(k => items.push({ type: "img", key: k }));
  shuffle(items).forEach((it, i) => {
    it.th = i / items.length * TAU + Math.random() * .5;
    it.R  = .5 + Math.random() * .55;
    it.hf = .1 + Math.random() * .72;
    it.om = (.09 + Math.random() * .1) * (Math.random() < .5 ? -1 : 1);
    it.ph = Math.random() * TAU;
  });

  /* ---------- medidas ---------- */
  function applyPadding(){
    const vw = document.documentElement.clientWidth;
    stage.style.width = vw + "px";
    const Rx = Math.min(vw * .48, 300), hw = Math.min(vw * .5, 250);
    stage.style.paddingTop = (hw * .95 + 16) + "px";
    stage.style.paddingBottom = (Rx * .3 + 24) + "px";
    geo.Rx = Rx; geo.Ry = Rx * .3; geo.hw = hw;
    U = Math.max(.75, Math.min(vw / 420, 1.35));
  }
  function measure(){
    const sr = stage.getBoundingClientRect(), rr = rw.getBoundingClientRect();
    const w = Math.round(sr.width), h = Math.round(sr.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (w !== SW || h !== SH || cv.width !== Math.round(w * dpr)) {
      SW = w; SH = h;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    geo.gx = SW / 2;
    geo.gy = (rr.bottom - sr.top) - rr.height * .03;   /* la galaxia queda justo bajo el ramo */
    geo.hcx = SW / 2;
    geo.hcy = 8 + geo.hw * .47;
  }

  /* ---------- dibujo ---------- */
  function frame(now){
    requestAnimationFrame(frame);
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    tt += dt * SP;
    op = clamp(op + (opened ? 1 : -1) * dt / 2.4, 0, 1);
    const e = op * op * (3 - 2 * op);
    const ga = .45 + .55 * e;
    const { gx, gy, Rx, Ry, hcx, hcy, hw } = geo;
    const rot = tt * .14;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, SW, SH);
    ctx.globalCompositeOperation = "lighter";

    /* estrellas */
    ctx.fillStyle = "#fff8d0";
    for (const st of stars) {
      ctx.globalAlpha = (.12 + .5 * (.5 + .5 * Math.sin(tt * st.tw + st.ph))) * (.55 + .45 * e);
      ctx.fillRect(st.x * SW, st.y * SH, st.s, st.s);
    }

    /* resplandor de la galaxia */
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(gx, gy); ctx.scale(1, .34);
    let g = ctx.createRadialGradient(0, 0, 0, 0, 0, Rx * 1.05);
    g.addColorStop(0, `rgba(255,236,140,${.5 * ga})`);
    g.addColorStop(.35, `rgba(230,190,40,${.2 * ga})`);
    g.addColorStop(1, "rgba(200,170,20,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, Rx * 1.05, 0, TAU); ctx.fill();
    ctx.restore();

    /* resplandor del corazón */
    if (e > .01) {
      const rg = Math.min(hw * .95, hcy - 2);
      g = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, rg);
      g.addColorStop(0, `rgba(255,225,110,${.2 * e})`);
      g.addColorStop(1, "rgba(255,210,60,0)");
      ctx.fillStyle = g;
      ctx.fillRect(hcx - rg, hcy - rg, rg * 2, rg * 2);
    }

    /* polvo de la galaxia */
    for (let b = 0; b < 5; b++) {
      ctx.fillStyle = COLS[b];
      const arr = dust[b];
      for (let i = 0; i < arr.length; i++) {
        const p = arr[i], a = p.th + rot;
        ctx.globalAlpha = ga * p.a * (.55 + .45 * Math.sin(tt * p.tw + p.ph));
        ctx.fillRect(gx + Math.cos(a) * p.r * Rx, gy + Math.sin(a) * p.r * Ry + p.dz, p.s, p.s);
      }
    }

    /* corazón de partículas */
    const s = hw / 32 * (1 + .022 * Math.sin(tt * 2.6) * e);
    const elapsed = tt - openT;
    for (let b = 0; b < 3; b++) {
      ctx.fillStyle = HCOLS[b];
      const arr = hb[b];
      for (let i = 0; i < arr.length; i++) {
        const p = arr[i], rel = opened && elapsed > p.dl;
        let tx, ty;
        if (rel) { tx = hcx + p.hx * s; ty = hcy - (p.hy + 2.5) * s; }
        else { const a = p.gth + rot; tx = gx + Math.cos(a) * p.gr * Rx; ty = gy + Math.sin(a) * p.gr * Ry; }
        if (p.x === null) { p.x = tx; p.y = ty; }
        const f = Math.min(1, (rel ? p.k : 5) * dt);
        p.x += (tx - p.x) * f; p.y += (ty - p.y) * f;
        let dx = p.x, dy = p.y;
        if (rel) {                       /* pequeña curva para que suban en corrientes */
          const ex = tx - p.x, ey = ty - p.y, d = Math.hypot(ex, ey);
          if (d > 2) { const w = Math.sin(tt * 2.4 + p.ph) * Math.min(d, 140) * .16 / d; dx -= ey * w; dy += ex * w; }
        }
        ctx.globalAlpha = ga * p.a * (.4 + .6 * (.5 + .5 * Math.sin(tt * p.tw + p.ph))) * (rel ? 1 : .7);
        ctx.fillRect(dx, dy, p.s, p.s);
      }
    }

    /* núcleo brillante de la galaxia */
    ctx.save();
    ctx.translate(gx, gy); ctx.scale(1, .34);
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, Rx * .16);
    g.addColorStop(0, `rgba(255,252,225,${.9 * ga})`);
    g.addColorStop(1, "rgba(255,225,120,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, Rx * .16, 0, TAU); ctx.fill();
    ctx.restore();

    /* objetos en órbita */
    ctx.globalCompositeOperation = "source-over";
    if (e > .01) {
      const hMax = gy - 16;
      const list = items.map(it => {
        const a = it.th + tt * it.om;
        return { it, X: Math.cos(a) * it.R, Z: Math.sin(a) * it.R };
      }).sort((a, b) => a.Z - b.Z);

      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (const o of list) {
        const it = o.it, dn = (o.Z / 1.05 + 1) / 2, sc = .62 + .5 * dn, alpha = (.5 + .5 * dn) * e;
        let x = gx + o.X * Rx;
        const y = gy + o.Z * Ry - hMax * it.hf + Math.sin(tt * .9 + it.ph) * 7;
        if (it.type === "img") {
          const S = SPR[it.key], w = S.w * U * sc, h = w * S.ar;
          if (S.im.complete && S.im.naturalWidth) {
            ctx.globalCompositeOperation = "lighter";
            ctx.globalAlpha = alpha * .35;
            ctx.drawImage(halo, x - w * .9, y - w * .9, w * 1.8, w * 1.8);
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = alpha;
            ctx.drawImage(S.im, x - w / 2, y - h / 2, w, h);
          }
        } else {
          const fs = Math.round(16 * U * sc * (it.big ? 1.25 : 1));
          ctx.font = `italic 700 ${fs}px ${FONT}`;
          const w = ctx.measureText(it.text).width;
          x = clamp(x, w / 2 + 6, SW - w / 2 - 6);
          ctx.globalAlpha = alpha;
          ctx.shadowColor = "rgba(255,214,70,.95)";
          ctx.shadowBlur = 10 * dpr;
          ctx.fillStyle = "#fff3b0";
          ctx.fillText(it.text, x, y);
          ctx.shadowBlur = 0;
        }
      }

      /* texto dentro del corazón */
      const ta = clamp((elapsed / 4.6 - .6) / .4, 0, 1) * e;
      if (ta > .01) {
        ctx.font = `italic 400 ${Math.round(hw * .17)}px ${FONT}`;
        ctx.globalAlpha = ta;
        ctx.shadowColor = "rgba(255,214,70,.95)";
        ctx.shadowBlur = 12 * dpr;
        ctx.fillStyle = "#fff6c8";
        ctx.fillText(CONFIG.corazon, hcx, hcy - s);
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;
  }

  applyPadding(); measure();
  addEventListener("resize", () => { applyPadding(); measure(); });
  if ("ResizeObserver" in window) new ResizeObserver(measure).observe(stage);
  requestAnimationFrame(frame);

  return {
    open(){ opened = true; openT = tt; measure(); },
    close(){ opened = false; measure(); }
  };
})();

/* ============== CARTA (efecto máquina de escribir) ============== */
let typingTimer;
function typeMessage(text){
  clearTimeout(typingTimer);
  message.textContent = "";
  const chars = Array.from(text);   /* respeta los emojis */
  let i = 0;
  (function step(){
    if (i < chars.length) {
      message.textContent += chars[i++];
      typingTimer = setTimeout(step, 26);
    } else {
      firma.classList.add("show");
    }
  })();
}

/* ============== EFECTO AL TOCAR ============== */
function touchEffect(x, y){
  const pop = (txt, dx, dy, size, delay) => {
    const t = document.createElement("div");
    t.className = "touch";
    t.textContent = txt;
    t.style.left = (x + dx) + "px";
    t.style.top = (y + dy) + "px";
    t.style.fontSize = size + "px";
    if (delay) t.style.animationDelay = delay + "ms";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1400);
  };
  pop("💛", 0, 0, 30 + Math.random() * 10, 0);
  ["✨", "💫", "🌻"].forEach((s, i) =>
    pop(s, Math.random() * 46 - 23, Math.random() * 42 - 21, 14 + Math.random() * 10, i * 70));
}
document.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  touchEffect(e.clientX, e.clientY);
});

/* ============== ABRIR / CERRAR ============== */
let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

openBtn.addEventListener("click", () => {
  scene.classList.add("opened");
  document.body.classList.add("opened");
  openBtn.hidden = true;
  closeBtn.hidden = false;
  Scene.open();
  /* primero se disfruta la escena; luego bajamos a la carta (solo si la persona no bajó ya) */
  later(() => {
    if (window.scrollY < 60)
      card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  }, 5000);
  later(() => typeMessage(CONFIG.mensaje), 5200);
});

closeBtn.addEventListener("click", () => {
  timers.forEach(clearTimeout); timers = [];
  scene.classList.remove("opened");
  document.body.classList.remove("opened");
  closeBtn.hidden = true;
  openBtn.hidden = false;
  Scene.close();
  clearTimeout(typingTimer);
  message.textContent = "";
  firma.classList.remove("show");
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
});
</script>
